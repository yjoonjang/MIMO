[project]
name = "mimo"
version = "1.0.0"
description = "MIMO: Multilingual Information Retrieval via Monolingual Objectives (EMNLP 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Youngjoon Jang" },
    { name = "Seongtae Hong" },
    { name = "Heuiseok Lim" },
]
dependencies = [
    "datasets>=4.5.0",
    "fire>=0.7.1",
    "huggingface-hub>=0.26.0",
    "mteb>=1.6.35",
    "numpy<2.0",
    "scipy>=1.10.0",
    "sentence-transformers[train]>=5.1.1",
    "torch==2.8.0",
    "transformers>=5.0.0",
    "wandb>=0.24.0",
]

[project.optional-dependencies]
# Optional: FlashAttention-2 for the Qwen3-Embedding-8B teacher.
# Without it, pass --teacher_attn_implementation sdpa to train.py.
flash = ["flash-attn==2.8.3"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimo"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
